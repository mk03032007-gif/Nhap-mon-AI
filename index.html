<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR GPS - Tòa B4 ĐH Đồng Tháp</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="./assets/10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./assets/10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-obj-model 
        src="#bird-obj" 
        mtl="#bird-mtl" 
        gps-entity-place="latitude: 10.421500; longitude: 105.643072;"
        position="0 0 0"
        scale="0.3 0.3 0.3"
        look-at="[gps-camera]"> 
      </a-obj-model>

      <a-camera 
        gps-camera="gpsMinDistance: 1; maxDistance: 50; alert: true;" 
        rotation-reader>
      </a-camera>
      
    </a-scene>

    <script>
      // ĐOẠN SCRIPT ÉP ĐIỆN THOẠI ĐỌC GPS CHÍNH XÁC CAO (HIGH ACCURACY)
      window.addEventListener('load', () => {
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            (position) => {
              console.log("Độ chính xác hiện tại: " + position.coords.accuracy + " mét.");
            }, 
            (err) => { console.error(err); }, 
            {
              enableHighAccuracy: true, // Ép dùng GPS vệ tinh thay vì Wifi/Mạng di động sai số lớn
              maximumAge: 0,
              timeout: 5000
            }
          );
        }
      });
    </script>
  </body>
</html>
