<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR - Kiểm tra quét mã Hiro</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <a-assets>
        <a-asset-item id="horse-obj" src="assets/10026_Horse_v01-it2.obj"></a-asset-item>
        <a-asset-item id="horse-mtl" src="assets/10026_Horse_v01-it2.mtl"></a-asset-item>
      </a-assets>

      <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
      <a-entity light="type: directional; intensity: 1.0;" position="0 5 0"></a-entity>

      <a-marker preset="hiro">
        
        <a-box position="0 0.5 0" material="color: red; opacity: 0.8;" scale="0.3 0.3 0.3"></a-box>

        <a-entity
          obj-model="obj: #horse-obj; mtl: #horse-mtl"
          position="0 0 0"
          scale="0.0003 0.0003 0.0003"
          rotation="0 0 0">
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

  </body>
</html>
