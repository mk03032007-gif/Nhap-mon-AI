<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR GPS - Tòa B4 ĐH Đồng Tháp</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">

  <a-scene
  embedded
  vr-mode-ui="enabled: false"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

  <a-box
    position="0 0 -5"
    color="red"
    scale="2 2 2">
  </a-box>

  <a-camera
    gps-camera="gpsMinDistance: 1; maxDistance: 500; alert: true;"
    rotation-reader>
  </a-camera>

</a-scene>

      <a-assets>
        <a-asset-item id="bird-obj" src="./assets/10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./assets/10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>

      <!-- Mô hình tại vị trí mới -->
<a-box
  position="0 0 -5"
  color="red"
  scale="2 2 2">
</a-box>

      <!-- Tăng khoảng cách nhận diện -->
      <a-camera
        gps-camera="gpsMinDistance: 1; maxDistance: 500; alert: true;"
        rotation-reader>
      </a-camera>

    </a-scene>

    <script>
      window.addEventListener('load', () => {
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            (position) => {
              console.log(
                "Lat:", position.coords.latitude,
                "Lng:", position.coords.longitude,
                "Accuracy:", position.coords.accuracy + "m"
              );
            },
            (err) => {
              console.error(err);
            },
            {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: 10000
            }
          );
        }
      });
    </script>

  </body>
</html>
